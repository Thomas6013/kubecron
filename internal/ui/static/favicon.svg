<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#1a1d27"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#6c8ef7" stroke-width="1.5"/>
  <!-- 5 standard spokes (K8s wheel) in accent blue — spokes 1–5 -->
  <g stroke="#6c8ef7" stroke-width="1.5" stroke-linecap="round">
    <line x1="18.35" y1="14.13" x2="24.21" y2="9.45"/>
    <line x1="18.92" y1="16.67" x2="26.24" y2="18.34"/>
    <line x1="17.30" y1="18.70" x2="20.55" y2="25.46"/>
    <line x1="14.70" y1="18.70" x2="11.45" y2="25.46"/>
    <line x1="13.08" y1="16.67" x2="5.76"  y2="18.34"/>
  </g>
  <!-- 2 "clock-hand" spokes (12 o'clock + 10 o'clock) in green — cron indicator -->
  <g stroke="#48bb78" stroke-width="2.5" stroke-linecap="round">
    <line x1="16"    y1="13"    x2="16"   y2="5.5"/>
    <line x1="13.65" y1="14.13" x2="7.79" y2="9.45"/>
  </g>
  <!-- Center hub -->
  <circle cx="16" cy="16" r="2.5" fill="#6c8ef7"/>
</svg>
