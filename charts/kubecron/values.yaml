image:
  repository: ghcr.io/thomas6013/kubecron
  tag: ""  # defaults to Chart.AppVersion
  pullPolicy: IfNotPresent
  pullSecrets: []
  # pullSecrets:
  #   - ghcr-login-secret

nameOverride: ""
fullnameOverride: ""

# Which half of KubeCron this release runs.
#
#   ui     — the standalone product: dashboard, JSON API, and the CronJob
#            controls (suspend / resume / trigger). The default.
#   server — headless collector: only the read-only /api/v1 contract a console
#            such as KubeDeck reads. No HTML, no mutating endpoints.
#
# The collection machinery is identical in both: informers, the resource
# sampler, log capture and retention all run the same way. Only the HTTP
# surface differs, so a release can be switched from one to the other and keeps
# its history.
mode: ui

# Core app config
config:
  port: 8080
  # Days of run history (metadata) to keep in SQLite
  retentionDays: 90
  # Days of raw log lines to keep (should be <= retentionDays)
  logRetentionDays: 14
  metricsSampleInterval: 15

# OIDC / SSO — set enabled: true to activate
oidc:
  enabled: false
  issuerURL: ""
  clientID: ""
  redirectURL: ""  # must be https://<host>/auth/callback in production
  # Reference an existing Secret that has keys: client-secret, session-key
  # If empty, clientSecret and sessionKey below are used to create a new Secret.
  existingSecret: ""
  clientSecret: ""
  sessionKey: ""   # any string >= 32 chars; SHA-256 derived internally
  # Authorization (optional). Comma-separated email lists; empty = no restriction.
  allowedEmails: ""    # who may log in at all
  operatorEmails: ""   # who may suspend/resume/trigger; others are read-only

# The collector API's front door.
#
# OIDC is a browser redirect flow and a program cannot complete it, so a
# collector is guarded by a shared bearer token instead. Leaving it empty means
# every /api/v1 route and /metrics answer anonymously — which discloses the
# whole CronJob inventory, run outcomes and captured log bodies, though it can
# never mutate anything.
# In mode: ui it matters just as much, and for the opposite reason: OIDC answers
# an unauthenticated request with a redirect to an identity provider, which a
# console cannot follow. Set a token and /api/v1 is guarded by it while the
# dashboard keeps OIDC — two doors, each for the client that can open it.
# Without one, /api/v1 stays behind the session guard and no program can read it.
api:
  # Name of an existing Secret with an `api-token` key. Takes precedence over
  # `token` below.
  existingSecret: ""
  # Inline token. Generate one with: openssl rand -hex 32
  token: ""

# Name this cluster reports as when KubeCron runs on its own ServiceAccount
# (mode: server, no kubeconfigs) — the one-collector-per-cluster shape.
#
# It is the ID a consumer sees in /api/v1/clusters and the key every stored row
# hangs off, so changing it on a release with an existing PVC orphans that
# release's history. Set it once, to something the console can recognise.
clusterID: local

# Kubeconfigs — one file per cluster, mounted at /etc/kubecron/kubeconfigs
kubeconfigs:
  # Name of an existing Secret (Opaque) whose keys are cluster IDs
  # and values are base64-encoded kubeconfigs.
  # If set, the chart will NOT create a new Secret.
  existingSecret: ""
  # Inline kubeconfigs: key = clusterID, value = base64-encoded kubeconfig.
  # Generate with: kubectl config view --minify --raw | base64 -w0
  data: {}
  # data:
  #   prod-eu: <base64-kubeconfig>
  #   staging-us: <base64-kubeconfig>

# SQLite data volume
persistence:
  enabled: true
  storageClass: ""
  size: 500Mi
  accessMode: ReadWriteOnce
  # Use an existing PVC instead of creating one
  existingClaim: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

security:
  # KubeCron has no authentication of its own beyond what is configured here.
  #
  # In mode: ui, oidc.enabled=false leaves every endpoint anonymous — including
  # suspend/resume/trigger, which act on every cluster whose kubeconfig is
  # mounted. In mode: server there are no mutating endpoints, but an empty
  # api.token leaves the whole recorded history readable by anyone who can
  # reach the Service.
  #
  # The chart therefore refuses to install when the service is reachable from
  # outside the cluster (ingress.enabled=true, or service.type other than
  # ClusterIP) with no front door configured for the mode in use. Set this to
  # true only when the network is trusted and authentication is enforced
  # upstream — an authenticating proxy, a service mesh, or a VPN-only ingress.
  # See SEC-28 in docs/AUDIT.md.
  acknowledgeInsecureExposure: false

service:
  # Anything other than ClusterIP reaches outside the cluster and requires a
  # front door for the mode in use (oidc.enabled=true, or api.token in server
  # mode), or security.acknowledgeInsecureExposure=true.
  #
  # ClusterIP is the right answer for a collector: a console reaches it through
  # a port forward, which needs no Ingress, no certificate and no public name.
  type: ClusterIP
  port: 80
  # In mode: server the Service is labelled so a console can *find* it rather
  # than be told about it — fourteen collector URLs typed into a settings page
  # is fourteen things to get wrong. Set to false to opt out of discovery.
  discoverable: true

ingress:
  # Requires oidc.enabled=true, or security.acknowledgeInsecureExposure=true.
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: kubecron.example.com
  tls: []
  # tls:
  #   - secretName: kubecron-tls
  #     hosts:
  #       - kubecron.example.com

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

# Extra pod labels / annotations
podLabels: {}
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
