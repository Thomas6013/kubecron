{{/* Validated here rather than in ingress.yaml/service.yaml: the Deployment is
     the one template that always renders, so the check cannot be skipped by
     whichever resource happens to be disabled (SEC-28). */}}
{{- include "kubecron.validateExposure" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubecron.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubecron.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the single replica holds a ReadWriteOnce PVC
  # with a single-writer SQLite/WAL database. RollingUpdate would try to start
  # the new pod before terminating the old one, causing a Multi-Attach volume
  # error and a stalled rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubecron.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubecron.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kubecron.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: kubecron
        image: {{ include "kubecron.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.config.port }}
          protocol: TCP
        env:
        - name: KUBECRON_MODE
          value: {{ include "kubecron.mode" . | quote }}
        - name: PORT
          value: {{ .Values.config.port | quote }}
        - name: DB_PATH
          value: /data/kubecron.db
        - name: KUBECONFIG_DIR
          value: /etc/kubecron/kubeconfigs
        - name: RETENTION_DAYS
          value: {{ .Values.config.retentionDays | quote }}
        - name: LOG_RETENTION_DAYS
          value: {{ .Values.config.logRetentionDays | quote }}
        - name: METRICS_SAMPLE_INTERVAL
          value: {{ .Values.config.metricsSampleInterval | quote }}
        {{- /* The collector API's token. Rendered in BOTH modes: in ui mode it is
               what lets a console read /api/v1 without following an OIDC
               redirect it cannot complete, while the dashboard keeps the
               session guard. Absent, /api/v1 stays behind the session. */}}
        {{- if include "kubecron.apiTokenSecretName" . }}
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "kubecron.apiTokenSecretName" . }}
              key: api-token
        {{- end }}
        {{- if eq (include "kubecron.mode" .) "server" }}
        {{- /* Names the cluster when the pod watches itself through its own
               ServiceAccount, which is the shape a per-cluster collector runs
               in. Ignored when kubeconfigs are mounted: those name themselves. */}}
        - name: CLUSTER_ID
          value: {{ .Values.clusterID | quote }}
        {{- end }}
        {{- if and .Values.oidc.enabled (eq (include "kubecron.mode" .) "ui") }}
        - name: OIDC_ENABLED
          value: "true"
        - name: OIDC_ISSUER_URL
          value: {{ required "oidc.issuerURL is required when oidc.enabled=true" .Values.oidc.issuerURL | quote }}
        - name: OIDC_CLIENT_ID
          value: {{ required "oidc.clientID is required when oidc.enabled=true" .Values.oidc.clientID | quote }}
        - name: OIDC_REDIRECT_URL
          value: {{ required "oidc.redirectURL is required when oidc.enabled=true" .Values.oidc.redirectURL | quote }}
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "kubecron.oidcSecretName" . }}
              key: client-secret
        - name: OIDC_SESSION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "kubecron.oidcSecretName" . }}
              key: session-key
        {{- with .Values.oidc.allowedEmails }}
        - name: OIDC_ALLOWED_EMAILS
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.oidc.operatorEmails }}
        - name: OIDC_OPERATOR_EMAILS
          value: {{ . | quote }}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /data
        {{- if or .Values.kubeconfigs.existingSecret .Values.kubeconfigs.data }}
        - name: kubeconfigs
          mountPath: /etc/kubecron/kubeconfigs
          readOnly: true
        {{- end }}
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.config.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.config.port }}
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "kubecron.pvcName" . }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if or .Values.kubeconfigs.existingSecret .Values.kubeconfigs.data }}
      - name: kubeconfigs
        secret:
          secretName: {{ include "kubecron.kubeconfigsSecretName" . }}
      {{- end }}
      - name: tmp
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
