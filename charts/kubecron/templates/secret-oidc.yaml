{{- if and .Values.oidc.enabled (not .Values.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubecron.fullname" . }}-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubecron.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ required "oidc.clientSecret is required when oidc.enabled=true and no existingSecret" .Values.oidc.clientSecret | quote }}
  session-key: {{ required "oidc.sessionKey is required when oidc.enabled=true and no existingSecret" .Values.oidc.sessionKey | quote }}
{{- end }}
