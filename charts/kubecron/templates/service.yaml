apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubecron.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubecron.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kubecron.selectorLabels" . | nindent 4 }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.config.port }}
    protocol: TCP
    name: http
