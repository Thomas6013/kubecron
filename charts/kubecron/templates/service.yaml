apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubecron.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubecron.labels" . | nindent 4 }}
    {{- if and (eq (include "kubecron.mode" .) "server") .Values.service.discoverable }}
    {{- /* Discovery labels. A console looks for these rather than being handed
           a URL per cluster; a collector that is not labelled is simply not
           found, which degrades to "no collector here" by itself. */}}
    kubecron.io/collector: "true"
    app.kubernetes.io/component: collector
    {{- end }}
  {{- if and (eq (include "kubecron.mode" .) "server") .Values.service.discoverable }}
  annotations:
    kubecron.io/api-version: v1
    kubecron.io/api-path: /api/v1
    {{- /* Whether a caller needs a bearer token, so a console can say
           "found, but I have no credential" instead of showing an empty panel. */}}
    kubecron.io/auth: {{ ternary "bearer" "none" (ne (include "kubecron.apiTokenSecretName" .) "") | quote }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kubecron.selectorLabels" . | nindent 4 }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.config.port }}
    protocol: TCP
    name: http
