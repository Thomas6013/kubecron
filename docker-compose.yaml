# KubeCron — dev environment with live reload (air)
#
# Setup:
#   1. Kubeconfig(s) déjà présents dans dev/kubeconfigs/ (ex: "admin")
#      ⚠ Si cluster local (kind/minikube): remplacer 127.0.0.1 par host.docker.internal
#   2. docker compose up
#   3. http://localhost:8082
#
# Air surveille les fichiers .go/.templ/.css/.sql et rebuild + redémarre à chaque changement.
# Premier démarrage ~2 min (install templ+air + build). Suivants ~5 s grâce aux caches.

services:
  kubecron:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: >
      sh -c "
        command -v templ || go install github.com/a-h/templ/cmd/templ@v0.3.1020 &&
        command -v air   || go install github.com/air-verse/air@latest &&
        air -c .air.toml
      "
    ports:
      - "8082:8080"
    environment:
      DB_PATH: /data/kubecron.db
      KUBECONFIG_DIR: /etc/kubecron/kubeconfigs
      PORT: "8080"
      RETENTION_DAYS: "7"
      METRICS_SAMPLE_INTERVAL: "15"
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SESSION_KEY: ${OIDC_SESSION_KEY:-}
    volumes:
      - .:/app
      - kubecron-data:/data
      - ./dev/kubeconfigs:/etc/kubecron/kubeconfigs:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

volumes:
  kubecron-data:
  go-mod-cache:
  go-build-cache:
