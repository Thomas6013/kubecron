# KubeCron — dev environment with live reload (air)
#
# Setup:
#   1. Place kubeconfig(s) in dev/kubeconfigs/ (e.g. "admin")
#      ⚠ If using a local cluster (kind/minikube): replace 127.0.0.1 with host.docker.internal
#   2. docker compose up
#   3. http://localhost:8082
#
# Air watches .go/.templ/.css/.sql files and rebuilds + restarts on each change.
# First start ~2 min (install templ+air + build). Subsequent starts ~5 s thanks to caches.

services:
  kubecron:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: >
      sh -c "
        command -v templ || go install github.com/a-h/templ/cmd/templ@v0.3.1020 &&
        command -v air   || go install github.com/air-verse/air@latest &&
        air -c .air.toml
      "
    ports:
      - "8082:8080"
    environment:
      DB_PATH: /data/kubecron.db
      KUBECONFIG_DIR: /etc/kubecron/kubeconfigs
      PORT: "8080"
      RETENTION_DAYS: "7"
      METRICS_SAMPLE_INTERVAL: "15"
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SESSION_KEY: ${OIDC_SESSION_KEY:-}
    volumes:
      - .:/app
      - kubecron-data:/data
      - ./dev/kubeconfigs:/etc/kubecron/kubeconfigs:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

volumes:
  kubecron-data:
  go-mod-cache:
  go-build-cache:
