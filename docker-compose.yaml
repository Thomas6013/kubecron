# KubeCron — local dev (même image que la prod)
#
# Usage:
#   1. Copier un kubeconfig dans dev/kubeconfigs/  (ex: cp ~/.kube/config dev/kubeconfigs/mycluster)
#      ⚠ kind/minikube : remplacer 127.0.0.1 par host.docker.internal dans le kubeconfig
#   2. docker compose up --build
#      → compile + démarre. Relancer la même commande après chaque changement de code.
#   3. http://localhost:8082

services:
  kubecron:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      DB_PATH: /data/kubecron.db
      KUBECONFIG_DIR: /etc/kubecron/kubeconfigs
      PORT: "8080"
      RETENTION_DAYS: "7"
      METRICS_SAMPLE_INTERVAL: "15"
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SESSION_KEY: ${OIDC_SESSION_KEY:-}
    volumes:
      - kubecron-data:/data
      - ./dev/kubeconfigs:/etc/kubecron/kubeconfigs:ro

volumes:
  kubecron-data:
