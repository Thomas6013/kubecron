name: Docker PR Preview

on:
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    name: Build PR preview image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Read owner
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "pr=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (amd64 only for speed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/kubecron:${{ steps.meta.outputs.pr }}
            ghcr.io/${{ steps.meta.outputs.owner }}/kubecron:${{ steps.meta.outputs.pr }}-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  comment:
    name: Post image tag to PR
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      pull-requests: write

    steps:
      - name: Read owner
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "pr=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = "${{ steps.meta.outputs.owner }}";
            const pr = "${{ steps.meta.outputs.pr }}";
            const sha = "${{ github.sha }}".slice(0, 7);
            const image = `ghcr.io/${owner}/kubecron`;
            const body = [
              `### Docker preview image (amd64)`,
              ``,
              `\`${image}:${pr}\``,
              ``,
              `Pinned to commit \`${sha}\`:`,
              `\`\`\`yaml`,
              `# k8s/deployment.yaml`,
              `image: ${image}:${pr}-${{ github.sha }}`,
              `\`\`\``,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === "github-actions[bot]" &&
              c.body.includes("Docker preview image")
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
