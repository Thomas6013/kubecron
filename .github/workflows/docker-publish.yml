name: Docker Publish

on:
  push:
    tags:
      - '*.*.*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & push kubecron
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and owner
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
            IS_RELEASE="true"
          else
            VERSION="main"
            IS_RELEASE="false"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (branch)
        if: steps.version.outputs.is_release == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/kubecron:main
            ghcr.io/${{ steps.version.outputs.owner }}/kubecron:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (release)
        id: build
        if: steps.version.outputs.is_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/kubecron:latest
            ghcr.io/${{ steps.version.outputs.owner }}/kubecron:${{ steps.version.outputs.value }}
            ghcr.io/${{ steps.version.outputs.owner }}/kubecron:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        if: steps.version.outputs.is_release == 'true'
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ghcr.io/${{ steps.version.outputs.owner }}/kubecron:${{ github.sha }}
          artifact-name: sbom-kubecron.spdx.json

      - name: Install cosign
        if: steps.version.outputs.is_release == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: steps.version.outputs.is_release == 'true'
        run: |
          cosign sign --yes \
            ghcr.io/${{ steps.version.outputs.owner }}/kubecron@${{ steps.build.outputs.digest }}
