name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Go build, vet, lint & test
    if: github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # Race detector requires CGO; run on Linux where a C toolchain is present.
      # The production binary is still built with CGO_ENABLED=0 elsewhere.
      - name: Race test
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"

      # The v1 module path is a dead end: golangci-lint v2 lives at
      # .../v2/cmd/golangci-lint, so `@latest` on the old path silently pinned
      # CI to the final v1 release and it never picked up a new check again.
      # Installing v2 explicitly keeps CI on the same semantics as .golangci.yml.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - run: helm lint charts/kubecron
