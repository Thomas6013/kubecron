name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to cluster '...'
        2. Open CronJob '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: KubeCron version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: k8s
    attributes:
      label: Kubernetes version
      placeholder: "1.30"

  - type: dropdown
    id: metrics
    attributes:
      label: metrics-server installed?
      options:
        - "Yes"
        - "No"
        - "Unknown"

  - type: dropdown
    id: oidc
    attributes:
      label: OIDC enabled?
      options:
        - "No"
        - "Yes"
        - "Unknown"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: KubeCron pod logs (`kubectl logs -n kubecron deployment/kubecron`), browser console errors, etc.
      render: shell
